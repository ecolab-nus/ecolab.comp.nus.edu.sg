<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - ECO Lab</title>
    <meta name="description" content="The page you are looking for does not exist.">
    <link rel="icon" type="image/svg+xml" href="static/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-page {
            text-align: center;
            padding: 120px 24px 80px;
        }
        .error-code {
            font-family: 'Roboto', sans-serif;
            font-size: 96px;
            font-weight: 700;
            color: #e8eaed;
            line-height: 1;
            margin-bottom: 16px;
        }
        .error-page h1 {
            font-family: 'Roboto', sans-serif;
            font-size: 24px;
            font-weight: 400;
            color: #212121;
            margin-bottom: 12px;
        }
        .error-page p {
            color: #5f6368;
            font-size: 16px;
            margin-bottom: 32px;
        }
        .error-home {
            display: inline-block;
            padding: 10px 28px;
            background: #1a73e8;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.2s;
        }
        .error-home:hover {
            background: #1557b0;
            text-decoration: none;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="page-container">
        <div class="error-page">
            <div class="error-code">404</div>
            <h1>Page Not Found</h1>
            <p>The page you are looking for doesn't exist or has been moved.</p>
            <a href="index.html" class="error-home">Back to Home</a>
        </div>
    </div>

    <script src="js/components.js"></script>
</body>
</html>
